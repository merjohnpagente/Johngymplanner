name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Apply custom app icon
        run: |
          if [ -f public/icon-512.png ]; then
            pip install pillow -q
            python3 - <<'EOF'
            from PIL import Image
            import os
            img = Image.open('public/icon-512.png')
            if 'A' in img.getbands():
                bbox = img.getchannel('A').getbbox()
                if bbox: img = img.crop(bbox)
            else:
                bbox = img.convert('L').point(lambda p: 0 if p > 245 else 255).getbbox()
                if bbox: img = img.crop(bbox)
            img = img.resize((512, 512), Image.LANCZOS).convert('RGB')
            sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
            n = 0
            for root, _, files in os.walk('android/app/src/main/res'):
                size = next((v for k, v in sizes.items() if k in os.path.basename(root)), None)
                if not size: continue
                for f in files:
                    if f.startswith('ic_launcher') and f.endswith('.png'):
                        img.resize((size, size), Image.LANCZOS).save(os.path.join(root, f))
                        n += 1
            print(f'icon applied to {n} files')
            EOF
          else
            echo "No public/icon-512.png, keeping default icon"
          fi
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: johns-fit-planner-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
